<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | Tasbehaaa For Hand Made Mirrors</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Cairo, sans-serif;
            background: #f8f3ed;
            color: #49382d;
            min-height: 100vh;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        .hidden {
            display: none !important;
        }

        /* ================= LOGIN ================= */

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background:
                radial-gradient(circle at top right, #ead8c6, transparent 35%),
                radial-gradient(circle at bottom left, #dfc5b5, transparent 35%),
                #f8f3ed;
        }

        .login-box {
            width: 100%;
            max-width: 460px;
            background: rgba(255,255,255,.94);
            padding: 42px 35px;
            border-radius: 25px;
            box-shadow: 0 25px 70px rgba(76,52,37,.16);
            border: 1px solid rgba(173,130,82,.2);
        }

        .login-logo {
            width: 115px;
            height: 115px;
            object-fit: contain;
            display: block;
            margin: 0 auto 20px;
        }

        .login-title {
            text-align: center;
            font-family: "Playfair Display", serif;
            font-size: 28px;
            color: #725438;
            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            color: #8b7767;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 700;
            font-size: 14px;
        }

        .input-group input,
        .form-control,
        .form-select,
        .form-textarea {
            width: 100%;
            border: 1px solid #dbcbbd;
            background: #fffdfb;
            border-radius: 12px;
            padding: 13px 15px;
            outline: none;
            transition: .2s;
        }

        .input-group input:focus,
        .form-control:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: #a67c52;
            box-shadow: 0 0 0 3px rgba(166,124,82,.1);
        }

        .form-textarea {
            min-height: 110px;
            resize: vertical;
        }

        .main-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 14px;
            background: linear-gradient(135deg,#a67c52,#765536);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(118,85,54,.22);
        }

        .login-message {
            text-align: center;
            margin-top: 15px;
            color: #b34444;
            font-size: 14px;
        }

        /* ================= DASHBOARD ================= */

        .dashboard {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 260px;
            background: #49382d;
            color: white;
            padding: 25px 18px;
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
        }

        .sidebar-logo {
            width: 90px;
            height: 90px;
            object-fit: contain;
            display: block;
            margin: 0 auto 10px;
            background: white;
            border-radius: 50%;
        }

        .sidebar-title {
            text-align: center;
            font-family: "Playfair Display", serif;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .nav-btn {
            width: 100%;
            border: none;
            background: transparent;
            color: #eee2d7;
            padding: 13px 15px;
            text-align: right;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 7px;
            font-size: 14px;
            transition: .2s;
        }

        .nav-btn:hover,
        .nav-btn.active {
            background: #a67c52;
            color: white;
        }

        .logout-btn {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 20px;
            background: #70463c;
        }

        .main-content {
            margin-right: 260px;
            width: calc(100% - 260px);
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .page-title {
            font-family: "Playfair Display", serif;
            font-size: 32px;
            color: #604533;
        }

        .lang-btn {
            border: 1px solid #c8ae96;
            background: white;
            color: #704f36;
            border-radius: 10px;
            padding: 9px 15px;
            cursor: pointer;
        }

        /* ================= CARDS ================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(72,51,35,.07);
            border: 1px solid #eadfd5;
        }

        .stat-title {
            color: #8c7867;
            font-size: 14px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: 800;
            color: #8b623e;
            margin-top: 5px;
        }

        .panel {
            background: white;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(72,51,35,.07);
            border: 1px solid #eadfd5;
            margin-bottom: 25px;
        }

        .panel-title {
            font-size: 21px;
            font-weight: 800;
            color: #604533;
            margin-bottom: 22px;
        }

        /* ================= FORM ================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 18px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .required {
            color: #b24d43;
        }

        .discount-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .image-input {
            padding: 15px;
            background: #faf7f4;
            border: 1px dashed #cbb6a4;
            border-radius: 14px;
        }

        .image-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(130px,1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .preview-item {
            position: relative;
            height: 130px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #e0d3c8;
            background: #eee;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,.55);
            color: white;
            padding: 4px;
            text-align: center;
            font-size: 11px;
        }

        .form-actions {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        .save-btn,
        .cancel-btn {
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }

        .save-btn {
            background: #8b623e;
            color: white;
        }

        .cancel-btn {
            background: #eee5dc;
            color: #654a36;
        }

        /* ================= PRODUCTS ================= */

        .filters {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 12px;
            margin-bottom: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(280px,1fr));
            gap: 20px;
        }

        .product-card {
            border: 1px solid #e7dbd1;
            border-radius: 17px;
            overflow: hidden;
            background: white;
        }

        .product-image {
            height: 240px;
            position: relative;
            background: #eee;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .discount-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #9d4c42;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
        }

        .product-body {
            padding: 17px;
        }

        .product-code {
            display: inline-block;
            background: #f1e8df;
            color: #7b573c;
            padding: 3px 8px;
            border-radius: 7px;
            font-size: 11px;
            margin-bottom: 8px;
            direction: ltr;
        }

        .product-name {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .product-category {
            color: #a08067;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .prices {
            display: flex;
            gap: 9px;
            align-items: center;
            margin-bottom: 15px;
        }

        .old-price {
            color: #999;
            text-decoration: line-through;
            font-size: 13px;
        }

        .new-price {
            color: #8b5235;
            font-weight: 800;
            font-size: 18px;
        }

        .product-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            border-radius: 9px;
            padding: 9px;
            cursor: pointer;
            font-weight: 700;
        }

        .edit-btn {
            background: #eadbc9;
            color: #62452f;
        }

        .delete-btn {
            background: #f3d8d5;
            color: #913e36;
        }

        .empty {
            text-align: center;
            padding: 50px;
            color: #9a8878;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #8a7666;
        }

        .toast {
            position: fixed;
            left: 25px;
            bottom: 25px;
            background: #49382d;
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.2);
            z-index: 9999;
            transform: translateY(100px);
            opacity: 0;
            transition: .3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* ================= MOBILE ================= */

        @media(max-width:900px) {

            .sidebar {
                width: 220px;
            }

            .main-content {
                margin-right: 220px;
                width: calc(100% - 220px);
                padding: 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }

        @media(max-width:700px) {

            .dashboard {
                display: block;
            }

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                padding: 15px;
            }

            .sidebar-logo {
                width: 70px;
                height: 70px;
            }

            .sidebar-title {
                margin-bottom: 15px;
            }

            .nav-btn {
                width: auto;
                display: inline-block;
                margin: 3px;
            }

            .logout-btn {
                position: static;
                margin-top: 10px;
            }

            .main-content {
                margin-right: 0;
                width: 100%;
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .discount-row {
                grid-template-columns: 1fr;
            }

            .topbar {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginPage" class="login-page">

    <div class="login-box">

        <img
            src="images/logo.png"
            class="login-logo"
            alt="Tasbehaaa"
        >

        <h1 class="login-title">
            Tasbehaaa
        </h1>

        <p class="login-subtitle">
            Admin Dashboard
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="admin@email.com"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    required
                >
            </div>

            <button
                type="submit"
                class="main-btn"
                id="loginBtn"
            >
                Login
            </button>

            <div
                id="loginMessage"
                class="login-message"
            ></div>

        </form>

    </div>

</section>


<!-- ================= DASHBOARD ================= -->

<section
    id="dashboard"
    class="dashboard hidden"
>

    <aside class="sidebar">

        <img
            src="images/logo.png"
            class="sidebar-logo"
            alt="Logo"
        >

        <div class="sidebar-title">
            Tasbehaaa Admin
        </div>

        <button
            class="nav-btn active"
            data-section="dashboardSection"
        >
            📊 Dashboard
        </button>

        <button
            class="nav-btn"
            data-section="addSection"
        >
            ➕ Add Product
        </button>

        <button
            class="nav-btn"
            data-section="productsSection"
        >
            🛍️ Products
        </button>

        <button
            id="logoutBtn"
            class="nav-btn logout-btn"
        >
            🚪 Logout
        </button>

    </aside>


    <main class="main-content">

        <div class="topbar">

            <h1
                class="page-title"
                id="pageTitle"
            >
                Dashboard
            </h1>

            <button
                id="languageBtn"
                class="lang-btn"
            >
                العربية
            </button>

        </div>


        <!-- ================= DASHBOARD ================= -->

        <section id="dashboardSection">

            <div class="stats">

                <div class="stat-card">

                    <div class="stat-title">
                        Total Products
                    </div>

                    <div
                        class="stat-number"
                        id="totalProducts"
                    >
                        0
                    </div>

                </div>

                <div class="stat-card">

                    <div class="stat-title">
                        Discounted Products
                    </div>

                    <div
                        class="stat-number"
                        id="discountedProducts"
                    >
                        0
                    </div>

                </div>

                <div class="stat-card">

                    <div class="stat-title">
                        Categories
                    </div>

                    <div
                        class="stat-number"
                        id="totalCategories"
                    >
                        0
                    </div>

                </div>

            </div>

            <div class="panel">

                <div class="panel-title">
                    Welcome to Tasbehaaa Admin
                </div>

                <p>
                    Manage your wedding and engagement
                    handmade products from here.
                </p>

            </div>

        </section>


        <!-- ================= ADD / EDIT ================= -->

        <section
            id="addSection"
            class="hidden"
        >

            <div class="panel">

                <div
                    class="panel-title"
                    id="formTitle"
                >
                    Add New Product
                </div>

                <form id="productForm">

                    <div class="form-grid">

                        <!-- PRODUCT CODE -->

                        <div class="form-group">

                            <label for="productCode">
                                Product Code
                                <span class="required">*</span>
                            </label>

                            <input
                                type="text"
                                id="productCode"
                                class="form-control"
                                placeholder="Example: TSM-001"
                                required
                            >

                        </div>


                        <!-- CATEGORY -->

                        <div class="form-group">

                            <label for="category">
                                Category
                                <span class="required">*</span>
                            </label>

                            <select
                                id="category"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    Select Category
                                </option>

                                <option value="مرايات">
                                    مرايات
                                </option>

                                <option value="صواني الشبكة">
                                    صواني الشبكة
                                </option>

                                <option value="البصمات">
                                    البصمات
                                </option>

                                <option value="بوكيهات الورد">
                                    بوكيهات الورد
                                </option>

                                <option value="مرايات الديكور">
                                    مرايات الديكور
                                </option>

                                <option value="مرايات بنترست">
                                    مرايات بنترست
                                </option>

                                <option value="بصمات كتب الكتاب">
                                    بصمات كتب الكتاب
                                </option>

                                <option value="Special Gift">
                                    Special Gift
                                </option>

                            </select>

                        </div>


                        <!-- ARABIC NAME -->

                        <div class="form-group">

                            <label for="nameAr">
                                اسم المنتج بالعربي
                            </label>

                            <input
                                type="text"
                                id="nameAr"
                                class="form-control"
                                placeholder="مثال: مراية كتب كتاب"
                            >

                        </div>


                        <!-- ENGLISH NAME -->

                        <div class="form-group">

                            <label for="nameEn">
                                Product Name English
                            </label>

                            <input
                                type="text"
                                id="nameEn"
                                class="form-control"
                                placeholder="Example: Wedding Mirror"
                            >

                        </div>


                        <!-- PRICE -->

                        <div class="form-group">

                            <label for="price">
                                Original Price
                                <span class="required">*</span>
                            </label>

                            <input
                                type="number"
                                id="price"
                                class="form-control"
                                min="0"
                                step="0.01"
                                placeholder="950"
                                required
                            >

                        </div>


                        <!-- DISCOUNT -->

                        <div class="form-group">

                            <label for="discount">
                                Discount %
                            </label>

                            <input
                                type="number"
                                id="discount"
                                class="form-control"
                                min="0"
                                max="100"
                                step="0.01"
                                value="0"
                                placeholder="20"
                            >

                        </div>


                        <!-- ARABIC DESCRIPTION -->

                        <div class="form-group">

                            <label for="descriptionAr">
                                الوصف بالعربي
                            </label>

                            <textarea
                                id="descriptionAr"
                                class="form-textarea"
                                placeholder="اكتب وصف المنتج بالعربي..."
                            ></textarea>

                        </div>


                        <!-- ENGLISH DESCRIPTION -->

                        <div class="form-group">

                            <label for="descriptionEn">
                                Product Description English
                            </label>

                            <textarea
                                id="descriptionEn"
                                class="form-textarea"
                                placeholder="Write product description..."
                            ></textarea>

                        </div>


                        <!-- IMAGES -->

                        <div class="form-group full">

                            <label for="productImages">
                                Product Images
                            </label>

                            <div class="image-input">

                                <input
                                    type="file"
                                    id="productImages"
                                    accept="image/*"
                                    multiple
                                >

                                <p style="margin-top:8px;font-size:12px;color:#8c7867;">
                                    يمكنك اختيار أكثر من صورة للمنتج.
                                </p>

                                <div
                                    id="imagePreview"
                                    class="image-preview"
                                ></div>

                            </div>

                        </div>

                    </div>


                    <div class="form-actions">

                        <button
                            type="submit"
                            class="save-btn"
                            id="saveProductBtn"
                        >
                            Save Product
                        </button>

                        <button
                            type="button"
                            class="cancel-btn"
                            id="cancelEditBtn"
                        >
                            Cancel
                        </button>

                    </div>

                </form>

            </div>

        </section>


        <!-- ================= PRODUCTS ================= -->

        <section
            id="productsSection"
            class="hidden"
        >

            <div class="panel">

                <div class="panel-title">
                    Products
                </div>

                <div class="filters">

                    <input
                        type="text"
                        id="searchProducts"
                        class="form-control"
                        placeholder="Search by product name or code..."
                    >

                    <select
                        id="filterCategory"
                        class="form-select"
                    >

                        <option value="">
                            All Categories
                        </option>

                        <option value="مرايات">
                            مرايات
                        </option>

                        <option value="صواني الشبكة">
                            صواني الشبكة
                        </option>

                        <option value="البصمات">
                            البصمات
                        </option>

                        <option value="بوكيهات الورد">
                            بوكيهات الورد
                        </option>

                        <option value="مرايات الديكور">
                            مرايات الديكور
                        </option>

                        <option value="مرايات بنترست">
                            مرايات بنترست
                        </option>

                        <option value="بصمات كتب الكتاب">
                            بصمات كتب الكتاب
                        </option>

                        <option value="Special Gift">
                            Special Gift
                        </option>

                    </select>

                </div>


                <div
                    id="productsContainer"
                    class="products-grid"
                >

                    <div class="loading">
                        Loading products...
                    </div>

                </div>

            </div>

        </section>

    </main>

</section>


<div
    id="toast"
    class="toast"
></div>


<script>

const SUPABASE_URL =
    "https://nzkgjobzxgvroyzmvvdi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_8aHDt5z7hV4Ojx69yJx8Fw_HWuFAJYJ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;
let editingProductId = null;
let currentProducts = [];

/* ================= ELEMENTS ================= */

const loginPage =
    document.getElementById("loginPage");

const dashboard =
    document.getElementById("dashboard");

const loginForm =
    document.getElementById("loginForm");

const loginMessage =
    document.getElementById("loginMessage");

const productForm =
    document.getElementById("productForm");

const imageInput =
    document.getElementById("productImages");

const imagePreview =
    document.getElementById("imagePreview");

const productsContainer =
    document.getElementById("productsContainer");


/* ================= TOAST ================= */

function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 3000);
}


/* ================= AUTH ================= */

async function checkSession() {

    const {
        data
    } = await supabaseClient.auth.getSession();

    if (!data.session) {

        showLogin();

        return;

    }

    currentUser =
        data.session.user;

    const isAdmin =
        await checkAdmin(currentUser.id);

    if (!isAdmin) {

        await supabaseClient.auth.signOut();

        showLogin();

        loginMessage.textContent =
            "هذا الحساب ليس Admin.";

        return;

    }

    showDashboard();

}


async function checkAdmin(userId) {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("admins")
            .select("user_id")
            .eq("user_id", userId)
            .maybeSingle();

    if (error) {

        console.error(error);

        return false;

    }

    return !!data;

}

    "change",

function renderImagePreview() {

    imagePreview.innerHTML = "";

    selectedFiles.forEach(
        (file,index) => {

            const reader =
                new FileReader();

            reader.onload = function(event) {

                const div =
                    document.createElement("div");

                div.className =
                    "preview-item";

                div.innerHTML = `
                    <img src="${event.target.result}">
                    <div class="preview-label">
                        Image ${index + 1}
                    </div>
                `;

                imagePreview.appendChild(div);

            };

            reader.readAsDataURL(file);

        }
    );

}


/* ================= UPLOAD ================= */

async function uploadImages(files) {

    const urls = [];

    for (
        let i = 0;
        i < files.length;
        i++
    ) {

        const file =
            files[i];

        const extension =
            file.name
                .split(".")
                .pop();

        const fileName =
            `${Date.now()}-${Math.random()
                .toString(36)
                .substring(2,9)}.${extension}`;

        const filePath =
            `products/${fileName}`;

        const {
            error
        } =
        await supabaseClient
            .storage
            .from("product-images")
            .upload(
                filePath,
                file
            );

        if (error) {

            console.error(error);

            throw error;

        }

        const {
            data
        } =
        supabaseClient
            .storage
            .from("product-images")
            .getPublicUrl(filePath);

        urls.push(data.publicUrl);

    }

    return urls;

}


/* ================= FORM ================= */

productForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const saveBtn =
            document.getElementById(
                "saveProductBtn"
            );

        saveBtn.disabled = true;

        saveBtn.textContent =
            "Saving...";

        try {

            const productCode =
                document
                .getElementById("productCode")
                .value
                .trim();

            const category =
                document
                .getElementById("category")
                .value;

            const nameAr =
                document
                .getElementById("nameAr")
                .value
                .trim();

            const nameEn =
                document
                .getElementById("nameEn")
                .value
                .trim();

            const price =
                Number(
                    document
                    .getElementById("price")
                    .value
                );

            const discount =
                Number(
                    document
                    .getElementById("discount")
                    .value
                ) || 0;

            const descriptionAr =
                document
                .getElementById("descriptionAr")
                .value
                .trim();

            const descriptionEn =
                document
                .getElementById("descriptionEn")
                .value
                .trim();


            if (!productCode) {

                throw new Error(
                    "Product Code is required."
                );

            }


            if (
                discount < 0 ||
                discount > 100
            ) {

                throw new Error(
                    "Discount must be between 0 and 100."
                );

            }


            /* upload new images */

            let newImageUrls = [];

            if (selectedFiles.length > 0) {

                newImageUrls =
                    await uploadImages(
                        selectedFiles
                    );

            }


            /* existing images when editing */

            let oldImageUrls = [];

            if (editingProductId) {

                const oldProduct =
                    currentProducts.find(
                        p =>
                        String(p.id) ===
                        String(editingProductId)
                    );

                if (oldProduct) {

                    oldImageUrls =
                        Array.isArray(
                            oldProduct.image_urls
                        )
                        ?
                        oldProduct.image_urls
                        :
                        [];

                }

            }


            const imageUrls =
                [
                    ...oldImageUrls,
                    ...newImageUrls
                ];


            const imageUrl =
                imageUrls.length
                ? imageUrls[0]
                : null;


            const productData = {

                product_code:
                    productCode,

                name:
                    nameAr ||
                    nameEn ||
                    productCode,

                name_ar:
                    nameAr,

                name_en:
                    nameEn,

                description:
                    descriptionAr ||
                    descriptionEn ||
                    "",

                description_ar:
                    descriptionAr,

                description_en:
                    descriptionEn,

                price:
                    price,

                discount_percent:
                    discount,

                category:
                    category,

                image_url:
                    imageUrl,

                image_urls:
                    imageUrls

            };


            let result;


            /* UPDATE */

            if (editingProductId) {

                result =
                    await supabaseClient
                    .from("products")
                    .update(productData)
                    .eq(
                        "id",
                        editingProductId
                    );

            }


            /* INSERT */

            else {

                result =
                    await supabaseClient
                    .from("products")
                    .insert(
                        productData
                    );

            }


            if (result.error) {

                if (
                    result.error.code ===
                    "23505"
                ) {

                    throw new Error(
                        "Product Code already exists. Use another code."
                    );

                }

                throw result.error;

            }


            showToast(
                editingProductId
                ? "Product updated successfully."
                : "Product added successfully."
            );


            resetForm();

            await loadProducts();

            await loadStats();


            document
            .querySelector(
                '[data-section="productsSection"]'
            )
            .click();


        }

        catch(error) {

            console.error(error);

            alert(
                error.message ||
                "Something went wrong."
            );

        }

        finally {

            saveBtn.disabled = false;

            saveBtn.textContent =
                "Save Product";

        }

    }
);

/* ================= LOAD PRODUCTS ================= */

async function loadProducts() {

    productsContainer.innerHTML =
        `<div class="loading">Loading products...</div>`;

    const {
        data,
        error
    } =
    await supabaseClient
        .from("products")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );

    if (error) {

        console.error(error);

        productsContainer.innerHTML =
            `<div class="empty">
                Error loading products.
            </div>`;

        return;

    }

    currentProducts =
        data || [];

    renderProducts(
        currentProducts
    );

}


/* ================= RENDER PRODUCTS ================= */

function renderProducts(products) {

    if (!products.length) {

        productsContainer.innerHTML =
            `<div class="empty">
                No products found.
            </div>`;

        return;

    }


    productsContainer.innerHTML =
        products
        .map(product => {

            const discount =
                Number(
                    product.discount_percent
                ) || 0;

            const price =
                Number(
                    product.price
                ) || 0;

            const finalPrice =
                price -
                (price * discount / 100);


            let image =
                product.image_url;

            if (
                Array.isArray(
                    product.image_urls
                ) &&
                product.image_urls.length
            ) {

                image =
                    product.image_urls[0];

            }


            const name =
                product.name_ar ||
                product.name_en ||
                product.name ||
                "Unnamed Product";


            return `

                <article class="product-card">

                    <div class="product-image">

                        ${
                            image
                            ?
                            `<img
                                src="${image}"
                                alt="${escapeHtml(name)}"
                            >`
                            :
                            `<div
                                style="
                                width:100%;
                                height:100%;
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                color:#999;
                                "
                            >
                                No Image
                            </div>`
                        }

                        ${
                            discount > 0
                            ?
                            `<span class="discount-badge">
                                -${discount}%
                            </span>`
                            :
                            ""
                        }

                    </div>


                    <div class="product-body">

                        <span class="product-code">
                            ${escapeHtml(
                                product.product_code ||
                                "NO CODE"
                            )}
                        </span>

                        <div class="product-name">
                            ${escapeHtml(name)}
                        </div>

                        <div class="product-category">
                            ${escapeHtml(
                                product.category || ""
                            )}
                        </div>

                        <div class="prices">

                            ${
                                discount > 0
                                ?
                                `<span class="old-price">
                                    ${price.toFixed(2)} EGP
                                </span>`
                                :
                                ""
                            }

                            <span class="new-price">
                                ${finalPrice.toFixed(2)} EGP
                            </span>

                        </div>


                        <div class="product-actions">

                            <button
                                class="edit-btn"
                                onclick="editProduct(${product.id})"
                            >
                                Edit
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteProduct(${product.id})"
                            >
                                Delete
                            </button>

                        </div>

                    </div>

                </article>

            `;

        })
        .join("");

}


/* ================= ESCAPE ================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* ================= EDIT ================= */

window.editProduct =
async function(id) {

    const product =
        currentProducts.find(
            p =>
            String(p.id) ===
            String(id)
        );

    if (!product) return;

    editingProductId =
        product.id;


    document
    .getElementById("productCode")
    .value =
        product.product_code || "";


    document
    .getElementById("category")
    .value =
        product.category || "";


    document
    .getElementById("nameAr")
    .value =
        product.name_ar || "";


    document
    .getElementById("nameEn")
    .value =
        product.name_en || "";


    document
    .getElementById("price")
    .value =
        product.price || 0;


    document
    .getElementById("discount")
    .value =
        product.discount_percent || 0;


    document
    .getElementById("descriptionAr")
    .value =
        product.description_ar || "";


    document
    .getElementById("descriptionEn")
    .value =
        product.description_en || "";


    selectedFiles = [];

    imagePreview.innerHTML = "";


    const existingImages =
        Array.isArray(product.image_urls)
        ?
        product.image_urls
        :
        product.image_url
        ?
        [product.image_url]
        :
        [];


    existingImages.forEach(
        (url,index) => {

            const div =
                document.createElement("div");

            div.className =
                "preview-item";

            div.innerHTML = `

                <img
                    src="${url}"
                    alt="Product Image"
                >

                <div class="preview-label">
                    Existing Image ${index + 1}
                </div>

            `;

            imagePreview.appendChild(div);

        }
    );


    document
    .getElementById("formTitle")
    .textContent =
        "Edit Product";


    document
    .querySelector(
        '[data-section="addSection"]'
    )
    .click();

};


/* ================= DELETE ================= */

window.deleteProduct =
async function(id) {

    const product =
        currentProducts.find(
            p =>
            String(p.id) ===
            String(id)
        );

    if (!product) return;


    const confirmed =
        confirm(
            `Delete product ${
                product.product_code ||
                product.name ||
                ""
            }?`
        );


    if (!confirmed) return;


    const {
        error
    } =
    await supabaseClient
        .from("products")
        .delete()
        .eq(
            "id",
            id
        );


    if (error) {

        console.error(error);

        alert(
            error.message
        );

        return;

    }


    showToast(
        "Product deleted successfully."
    );


    await loadProducts();

    await loadStats();

};


/* ================= SEARCH ================= */

document
.getElementById("searchProducts")
.addEventListener(
    "input",
    filterProducts
);


document
.getElementById("filterCategory")
.addEventListener(
    "change",
    filterProducts
);


function filterProducts() {

    const search =
        document
        .getElementById("searchProducts")
        .value
        .toLowerCase()
        .trim();


    const category =
        document
        .getElementById("filterCategory")
        .value;


    const filtered =
        currentProducts.filter(
            product => {

                const text =
                    [
                        product.product_code,
                        product.name,
                        product.name_ar,
                        product.name_en,
                        product.category
                    ]
                    .join(" ")
                    .toLowerCase();


                const matchesSearch =
                    !search ||
                    text.includes(search);


                const matchesCategory =
                    !category ||
                    product.category === category;


                return (
                    matchesSearch &&
                    matchesCategory
                );

            }
        );


    renderProducts(filtered);

}


/* ================= STATS ================= */

async function loadStats() {

    const {
        data,
        error
    } =
    await supabaseClient
        .from("products")
        .select(
            "id,category,discount_percent"
        );


    if (error) {

        console.error(error);

        return;

    }


    const products =
        data || [];


    document
    .getElementById("totalProducts")
    .textContent =
        products.length;


    document
    .getElementById("discountedProducts")
    .textContent =
        products.filter(
            p =>
            Number(
                p.discount_percent
            ) > 0
        ).length;


    const categories =
        new Set(
            products
            .map(
                p =>
                p.category
            )
            .filter(Boolean)
        );


    document
    .getElementById("totalCategories")
    .textContent =
        categories.size;

}
