<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | Tasbehaaa For Hand Made Mirrors</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --cream: #fbf7f1;
            --cream-dark: #f3eadf;
            --gold: #b28a52;
            --gold-dark: #8e6a3b;
            --brown: #513d32;
            --brown-light: #765d4e;
            --rose: #c9a39a;
            --white: #ffffff;
            --green: #52735b;
            --red: #a94a4a;
            --shadow: 0 12px 35px rgba(80, 55, 40, 0.10);
        }

        body {
            font-family: "Cairo", sans-serif;
            background: var(--cream);
            color: var(--brown);
            min-height: 100vh;
        }

        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }

        .hidden {
            display: none !important;
        }

        /* ================= HEADER ================= */

        header {
            background: rgba(255,255,255,0.95);
            border-bottom: 1px solid rgba(178,138,82,0.20);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .header-inner {
            max-width: 1400px;
            margin: auto;
            padding: 14px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .brand-text h1 {
            font-family: "Playfair Display", serif;
            color: var(--gold-dark);
            font-size: 20px;
        }

        .brand-text p {
            font-size: 12px;
            color: var(--brown-light);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .lang-btn,
        .logout-btn {
            border: 1px solid var(--gold);
            background: transparent;
            color: var(--gold-dark);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .logout-btn {
            background: var(--brown);
            color: white;
            border-color: var(--brown);
        }

        /* ================= LOGIN ================= */

        .login-page {
            min-height: calc(100vh - 85px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(178,138,82,0.18);
        }

        .login-logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            display: block;
            margin: 0 auto 15px;
        }

        .login-card h2 {
            text-align: center;
            font-family: "Playfair Display", serif;
            color: var(--gold-dark);
            margin-bottom: 8px;
        }

        .login-card .subtitle {
            text-align: center;
            color: #8b776d;
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* ================= FORM ================= */

        .field {
            margin-bottom: 17px;
        }

        .field label {
            display: block;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            border: 1px solid #ddd0c3;
            border-radius: 10px;
            padding: 12px 13px;
            outline: none;
            background: #fffdf9;
            color: var(--brown);
            transition: .2s;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(178,138,82,.10);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-left: 50px;
        }

        .show-password {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            cursor: pointer;
            color: var(--gold-dark);
        }

        .primary-btn {
            width: 100%;
            border: 0;
            border-radius: 10px;
            background: var(--brown);
            color: white;
            padding: 13px;
            cursor: pointer;
            font-weight: 800;
            transition: .2s;
        }

        .primary-btn:hover {
            background: var(--gold-dark);
        }

        .message {
            margin-top: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
        }

        .message.error {
            color: var(--red);
        }

        .message.success {
            color: var(--green);
        }

        /* ================= DASHBOARD ================= */

        .dashboard {
            max-width: 1400px;
            margin: auto;
            padding: 30px 20px 60px;
        }

        .dashboard-title {
            margin-bottom: 25px;
        }

        .dashboard-title h2 {
            font-family: "Playfair Display", serif;
            font-size: 30px;
            color: var(--gold-dark);
        }

        .dashboard-title p {
            color: #806e63;
            margin-top: 5px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 22px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(178,138,82,.12);
        }

        .stat-card span {
            font-size: 13px;
            color: #806e63;
        }

        .stat-card strong {
            display: block;
            font-size: 30px;
            color: var(--gold-dark);
            margin-top: 4px;
        }

        /* ================= PRODUCT FORM ================= */

        .panel {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(178,138,82,.12);
            margin-bottom: 25px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .panel-title h3 {
            color: var(--gold-dark);
            font-size: 21px;
        }

        .cancel-edit {
            border: 1px solid #d2c0af;
            background: white;
            color: var(--brown);
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 17px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .code-box {
            background: var(--cream);
            border: 1px dashed var(--gold);
            padding: 12px;
            border-radius: 10px;
            font-weight: 800;
            color: var(--gold-dark);
        }

        .code-box small {
            display: block;
            font-weight: 400;
            color: #806e63;
            margin-bottom: 3px;
        }

        /* ================= IMAGE UPLOAD ================= */

        .upload-area {
            border: 2px dashed #d8c3ae;
            border-radius: 12px;
            padding: 22px;
            text-align: center;
            background: #fffdf9;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: var(--gold);
        }

        .upload-area strong {
            display: block;
            color: var(--gold-dark);
            margin-bottom: 4px;
        }

        .upload-area span {
            font-size: 12px;
            color: #8b776d;
        }

        .image-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .preview-item {
            position: relative;
            height: 120px;
            border-radius: 10px;
            overflow: hidden;
            background: var(--cream-dark);
            border: 1px solid #ddcdbd;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-preview {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 25px;
            height: 25px;
            border: 0;
            border-radius: 50%;
            background: rgba(169,74,74,.90);
            color: white;
            cursor: pointer;
            font-weight: 800;
        }

        /* ================= CHECKBOXES ================= */

        .options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .check-card {
            border: 1px solid #dfd0c2;
            border-radius: 10px;
            padding: 13px;
            background: #fffdf9;
            cursor: pointer;
        }

        .check-card:hover {
            border-color: var(--gold);
        }

        .check-card input {
            margin-left: 7px;
            accent-color: var(--gold-dark);
        }

        /* ================= PRODUCTS ================= */

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .toolbar input,
        .toolbar select {
            border: 1px solid #ddd0c3;
            border-radius: 9px;
            padding: 11px 13px;
            background: #fffdf9;
            color: var(--brown);
            outline: none;
        }

        .toolbar input {
            flex: 1;
            min-width: 220px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .product-card {
            border: 1px solid #eadfd4;
            border-radius: 14px;
            overflow: hidden;
            background: white;
        }

        .product-image {
            height: 220px;
            position: relative;
            background: var(--cream-dark);
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .discount-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--rose);
            color: white;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
        }

        .product-info {
            padding: 15px;
        }

        .product-code {
            font-size: 11px;
            color: var(--gold-dark);
            font-weight: 800;
            direction: ltr;
            text-align: right;
        }

        .product-info h4 {
            margin: 5px 0;
            font-size: 16px;
        }

        .category-label {
            font-size: 11px;
            color: #88766c;
            margin-bottom: 8px;
        }

        .price {
            font-weight: 800;
            color: var(--gold-dark);
        }

        .old-price {
            color: #a99b92;
            text-decoration: line-through;
            font-size: 12px;
            margin-right: 5px;
        }

        .product-actions {
            display: flex;
            gap: 7px;
            margin-top: 13px;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .edit-btn {
            background: #f3eadf;
            border: 1px solid #ddc5aa;
            color: var(--gold-dark);
        }

        .delete-btn {
            background: #fff2f2;
            border: 1px solid #e5baba;
            color: var(--red);
        }

        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #8b776d;
        }

        /* ================= TOAST ================= */

        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--brown);
            color: white;
            padding: 13px 18px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            z-index: 9999;
            transform: translateY(120px);
            opacity: 0;
            transition: .3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 1100px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .options {
                grid-template-columns: 1fr;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .header-inner {
                padding: 12px 15px;
            }

            .brand-text h1 {
                font-size: 16px;
            }
        }

        @media (max-width: 520px) {
            .products-grid {
                grid-template-columns: 1fr;
            }

            .login-card {
                padding: 25px 18px;
            }

            .brand img {
                width: 45px;
                height: 45px;
            }

            .logout-btn,
            .lang-btn {
                padding: 7px 9px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header>
    <div class="header-inner">

        <div class="brand">
            <img src="images/logo.png" alt="Tasbehaaa Logo">

            <div class="brand-text">
                <h1>Tasbehaaa For Hand Made Mirrors</h1>
                <p id="headerSubtitle">لوحة تحكم الإدارة</p>
            </div>
        </div>

        <div class="header-actions">

            <button class="lang-btn" id="languageBtn">
                English
            </button>

            <button class="logout-btn hidden" id="logoutBtn">
                تسجيل الخروج
            </button>

        </div>

    </div>
</header>


<!-- ================= LOGIN ================= -->

<section class="login-page" id="loginPage">

    <div class="login-card">

        <img
            src="images/logo.png"
            alt="Tasbehaaa"
            class="login-logo"
        >

        <h2 id="loginTitle">
            دخول الإدارة
        </h2>

        <p class="subtitle" id="loginSubtitle">
            Tasbehaaa For Hand Made Mirrors
        </p>

        <form id="loginForm">

            <div class="field">

                <label id="emailLabel">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <label id="passwordLabel">
                    كلمة المرور
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="loginPassword"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword"
                    >
                        👁
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="primary-btn"
                id="loginButton"
            >
                تسجيل الدخول
            </button>

            <div
                class="message"
                id="loginMessage"
            ></div>

        </form>

    </div>

</section>


<!-- ================= DASHBOARD ================= -->

<main
    class="dashboard hidden"
    id="dashboard"
>

    <div class="dashboard-title">

        <h2 id="dashboardTitle">
            لوحة التحكم
        </h2>

        <p id="dashboardSubtitle">
            إدارة منتجات Tasbehaaa
        </p>

    </div>


    <!-- ================= STATS ================= -->

    <div class="stats">

        <div class="stat-card">
            <span id="totalProductsLabel">
                إجمالي المنتجات
            </span>

            <strong id="totalProducts">
                0
            </strong>
        </div>


        <div class="stat-card">
            <span id="discountProductsLabel">
                منتجات عليها خصم
            </span>

            <strong id="discountProducts">
                0
            </strong>
        </div>


        <div class="stat-card">
            <span id="categoriesLabel">
                الأقسام
            </span>

            <strong>
                8
            </strong>
        </div>

    </div>


    <!-- ================= ADD / EDIT PRODUCT ================= -->

    <section class="panel">

        <div class="panel-title">

            <h3 id="formTitle">
                إضافة منتج جديد
            </h3>

            <button
                type="button"
                class="cancel-edit hidden"
                id="cancelEdit"
            >
                إلغاء التعديل
            </button>

        </div>


        <form id="productForm">

            <div class="form-grid">


                <!-- PRODUCT CODE -->

                <div class="field">

                    <label id="codeLabel">
                        كود المنتج
                    </label>

                    <div class="code-box">

                        <small id="codeHelp">
                            يتم إنشاء الكود تلقائيًا
                        </small>

                        <span id="productCodePreview">
                            TSH-0001
                        </span>

                    </div>

                </div>


                <!-- CATEGORY -->

                <div class="field">

                    <label id="categoryLabel">
                        القسم
                    </label>

                    <select
                        id="categorySelect"
                        required
                    >

                        <option value="">
                            اختر القسم
                        </option>

                    </select>

                </div>


                <!-- ARABIC NAME -->

                <div class="field">

                    <label>
                        اسم المنتج بالعربي
                    </label>

                    <input
                        type="text"
                        id="nameAr"
                        placeholder="مثال: مرآة زفاف فاخرة"
                        required
                    >

                </div>


                <!-- ENGLISH NAME -->

                <div class="field">

                    <label>
                        Product Name in English
                    </label>

                    <input
                        type="text"
                        id="nameEn"
                        placeholder="Example: Luxury Wedding Mirror"
                        required
                        dir="ltr"
                    >

                </div>


                <!-- AR DESCRIPTION -->

                <div class="field">

                    <label>
                        الوصف بالعربي
                    </label>

                    <textarea
                        id="descriptionAr"
                        placeholder="اكتب وصف المنتج..."
                    ></textarea>

                </div>


                <!-- EN DESCRIPTION -->

                <div class="field">

                    <label>
                        Product Description in English
                    </label>

                    <textarea
                        id="descriptionEn"
                        placeholder="Write product description..."
                        dir="ltr"
                    ></textarea>

                </div>


                <!-- PRICE -->

                <div class="field">

                    <label id="priceLabel">
                        السعر
                    </label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="0.01"
                        placeholder="950"
                        required
                    >

                </div>


                <!-- DISCOUNT -->

                <div class="field">

                    <label id="discountLabel">
                        الخصم %
                    </label>

                    <input
                        type="number"
                        id="discountPercent"
                        min="0"
                        max="100"
                        step="0.01"
                        value="0"
                    >

                </div>


                <!-- IMAGES -->

                <div class="field full">

                    <label id="imagesLabel">
                        صور المنتج
                    </label>

                    <label
                        class="upload-area"
                        for="imageInput"
                    >

                        <strong>
                            📷 إضافة صور المنتج
                        </strong>

                        <span>
                            يمكنك اختيار أكثر من صورة
                        </span>

                    </label>

                    <input
                        type="file"
                        id="imageInput"
                        accept="image/*"
                        multiple
                        class="hidden"
                    >

                    <div
                        class="image-preview"
                        id="imagePreview"
                    ></div>

                </div>


                <!-- CUSTOMIZATION -->

                <div class="field full">

                    <label id="customizationLabel">
                        تخصيص المنتج للعميل
                    </label>

                    <div class="options">

                        <label class="check-card">

                            <input
                                type="checkbox"
                                id="allowNames"
                                checked
                            >

                            <span>
                                كتابة الأسماء
                            </span>

                        </label>


                        <label class="check-card">

                            <input
                                type="checkbox"
                                id="allowDate"
                            >

                            <span>
                                إضافة التاريخ
                            </span>

                        </label>


                        <label class="check-card">

                            <input
                                type="checkbox"
                                id="allowNotes"
                                checked
                            >

                            <span>
                                ملاحظات خاصة
                            </span>

                        </label>

                    </div>

                </div>


                <!-- SUBMIT -->

                <div class="field full">

                    <button
                        type="submit"
                        class="primary-btn"
                        id="saveProductBtn"
                    >
                        إضافة المنتج
                    </button>

                    <div
                        class="message"
                        id="formMessage"
                    ></div>

                </div>

            </div>

        </form>

    </section>


    <!-- ================= PRODUCTS ================= -->

    <section class="panel">

        <div class="panel-title">

            <h3 id="productsTitle">
                المنتجات
            </h3>

        </div>


        <div class="toolbar">

            <input
                type="search"
                id="searchInput"
                placeholder="ابحث بالكود أو اسم المنتج..."
            >

            <select id="filterCategory">

                <option value="">
                    كل الأقسام
                </option>

            </select>

        </div>


        <div
            class="products-grid"
            id="productsGrid"
        ></div>

        <div
            class="empty hidden"
            id="emptyProducts"
        >
            لا توجد منتجات حاليًا
        </div>

    </section>

</main>


<div
    class="toast"
    id="toast"
></div>

    function getCategoryByKey(key) {

        return CATEGORIES.find(
            category => category.key === key
        );

    }


    function getCategoryKey(product) {

        const ar =
            (product.category_ar || "").trim();

        const en =
            (product.category_en || "").trim();

        const legacy =
            (product.category || "").trim();


        const found =
            CATEGORIES.find(category =>
                category.ar === ar ||
                category.en === en ||
                category.ar === legacy ||
                category.en === legacy
            );

        return found
            ? found.key
            : "";

    }

    /* =========================================================
       PRODUCT CODE
    ========================================================= */

    function generateProductCode() {

        if (!products.length) {
            return "TSH-0001";
        }


        let maxNumber = 0;


        products.forEach(product => {

            const code =
                product.product_code || "";

            const match =
                code.match(/^TSH-(\d+)$/i);

            if (match) {

                const number =
                    parseInt(match[1], 10);

                if (number > maxNumber) {
                    maxNumber = number;
                }

            }

        });


        return (
            "TSH-" +
            String(maxNumber + 1).padStart(4, "0")
        );

    }

    imageInput.addEventListener(

    function renderImagePreview() {

        imagePreview.innerHTML = "";


        existingImages.forEach(
            (url, index) => {

                const item =
                    document.createElement("div");

                item.className =
                    "preview-item";

                item.innerHTML = `
                    <img src="${escapeHtml(url)}">
                    <button
                        type="button"
                        class="remove-preview"
                        onclick="removeExistingImage(${index})"
                    >
                        ×
                    </button>
                `;

                imagePreview.appendChild(item);

            }
        );


        selectedImages.forEach(
            (file, index) => {

                const item =
                    document.createElement("div");

                item.className =
                    "preview-item";

                const image =
                    document.createElement("img");

                const reader =
                    new FileReader();

                reader.onload =
                    e => {
                        image.src =
                            e.target.result;
                    };

                reader.readAsDataURL(file);


                const button =
                    document.createElement("button");

                button.type =
                    "button";

                button.className =
                    "remove-preview";

                button.textContent =
                    "×";

                button.onclick =
                    () => {

                        selectedImages.splice(
                            index,
                            1
                        );

                        renderImagePreview();

                    };


                item.appendChild(image);

                item.appendChild(button);

                imagePreview.appendChild(item);

            }
        );

    }


    window.removeExistingImage =
        function(index) {

            existingImages.splice(
                index,
                1
            );

            renderImagePreview();

        };


    /* =========================================================
       UPLOAD IMAGE
    ========================================================= */

    async function uploadImage(file) {

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();


        if (!user) {
            throw new Error("Not authenticated");
        }


        const extension =
            file.name
                .split(".")
                .pop()
                .toLowerCase();


        const random =
            Math.random()
                .toString(36)
                .substring(2, 10);


        const fileName =
            `${Date.now()}-${random}.${extension}`;


        const filePath =
            `${user.id}/${fileName}`;


        const {
            error
        } =
            await supabaseClient
                .storage
                .from("product-images")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl: "3600",
                        upsert: false
                    }
                );


        if (error) {
            throw error;
        }


        const {
            data
        } =
            supabaseClient
                .storage
                .from("product-images")
                .getPublicUrl(filePath);


        return data.publicUrl;

    }


    /* =========================================================
       PRODUCT SAVE
    ========================================================= */

    productForm.addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            const formMessage =
                document.getElementById("formMessage");

            formMessage.textContent = "";

            const categoryKey =
                categorySelect.value;


            if (!categoryKey) {

                formMessage.textContent =
                    translations[currentLanguage].requiredCategory;

                formMessage.className =
                    "message error";

                return;

            }


            if (
                !editingProductId &&
                selectedImages.length === 0
            ) {

                formMessage.textContent =
                    translations[currentLanguage].requiredImages;

                formMessage.className =
                    "message error";

                return;

            }


            const category =
                getCategoryByKey(categoryKey);


            const nameAr =
                document.getElementById("nameAr").value.trim();

            const nameEn =
                document.getElementById("nameEn").value.trim();

            const descriptionAr =
                document.getElementById("descriptionAr").value.trim();

            const descriptionEn =
                document.getElementById("descriptionEn").value.trim();

            const price =
                Number(
                    document.getElementById("price").value
                );

            const discountPercent =
                Number(
                    document.getElementById("discountPercent").value || 0
                );


            try {

                /* =========================
                   UPLOAD NEW IMAGES
                ========================= */

                const newImageUrls = [];


                for (
                    const file of selectedImages
                ) {

                    const url =
                        await uploadImage(file);

                    newImageUrls.push(url);

                }


                const allImages = [
                    ...existingImages,
                    ...newImageUrls
                ];


                if (!allImages.length) {

                    throw new Error(
                        "NO_IMAGES"
                    );

                }


                /* =========================
                   PRODUCT DATA
                ========================= */

                const productData = {

                    name:
                        nameAr,

                    name_ar:
                        nameAr,

                    name_en:
                        nameEn,

                    description:
                        descriptionAr,

                    description_ar:
                        descriptionAr,

                    description_en:
                        descriptionEn,

                    price:
                        price,

                    discount_percent:
                        Math.max(
                            0,
                            Math.min(
                                100,
                                discountPercent
                            )
                        ),

                    category:
                        category.ar,

                    category_ar:
                        category.ar,

                    category_en:
                        category.en,

                    image_url:
                        allImages[0],

                    image_urls:
                        allImages,

                    allow_custom_names:
                        document.getElementById(
                            "allowNames"
                        ).checked,

                    allow_custom_date:
                        document.getElementById(
                            "allowDate"
                        ).checked,

                    allow_custom_notes:
                        document.getElementById(
                            "allowNotes"
                        ).checked

                };


                /* =========================
                   ADD
                ========================= */

                if (!editingProductId) {

                    productData.product_code =
                        generateProductCode();


                    const {
                        error
                    } =
                        await supabaseClient
                            .from("products")
                            .insert(
                                productData
                            );


                    if (error) {
                        throw error;
                    }


                    showToast(
                        translations[currentLanguage].saved
                    );

                }


                /* =========================
                   EDIT
                ========================= */

                else {

                    const {
                        error
                    } =
                        await supabaseClient
                            .from("products")
                            .update(
                                productData
                            )
                            .eq(
                                "id",
                                editingProductId
                            );


                    if (error) {
                        throw error;
                    }


                    showToast(
                        translations[currentLanguage].saved
                    );

                }


                resetProductForm();

                await loadProducts();

            }

            catch (error) {

                console.error(error);

                formMessage.textContent =
                    error.message ||
                    translations[currentLanguage].uploadError;

                formMessage.className =
                    "message error";

            }

        }
    );

            document.getElementById(

            document.getElementById(

            document.getElementById(
                "allowNotes"
            ).checked =
                product.allow_custom_notes !== false;


            productCodePreview.textContent =
                product.product_code ||
                "TSH-XXXX";


            const storedImages =
                Array.isArray(product.image_urls)
                    ? product.image_urls
                    : [];


            existingImages =
                storedImages.length
                    ? [...storedImages]
                    : (
                        product.image_url

                            : []
                    );


            selectedImages =
                [];


            renderImagePreview();


            document.getElementById(
                "cancelEdit"
