<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin | Tasbehaaa For Hand Made Mirrors</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f1eb;
            color: #29221f;
        }

        .container {
            width: min(1200px, 94%);
            margin: auto;
        }

        /* LOGIN */

        #loginPage {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(70, 42, 32, .12);
            text-align: center;
        }

        .login-logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .login-box h1 {
            color: #8b5e55;
            margin-bottom: 8px;
        }

        .login-box p {
            color: #756b67;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: right;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #eaded7;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #fff;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #b8955c;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 12px;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: bold;
        }

        .primary-btn {
            width: 100%;
            background: #8b5e55;
            color: white;
        }

        .primary-btn:hover {
            background: #68423c;
        }

        .error {
            color: #b42318;
            margin-top: 15px;
            font-size: 14px;
        }

        /* DASHBOARD */

        #dashboard {
            display: none;
        }

        header {
            background: white;
            border-bottom: 1px solid #eaded7;
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .brand h2 {
            font-size: 18px;
            color: #8b5e55;
        }

        .logout-btn {
            background: #eee4df;
            color: #68423c;
        }

        .logout-btn:hover {
            background: #e2d4cd;
        }

        main {
            padding: 35px 0 60px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            color: #68423c;
            margin-bottom: 6px;
        }

        .welcome p {
            color: #756b67;
        }

        .grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 25px;
            align-items: start;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 35px rgba(70, 42, 32, .08);
        }

        .card h2 {
            margin-bottom: 20px;
            color: #68423c;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .save-btn {
            width: 100%;
            margin-top: 10px;
            background: #8b5e55;
            color: white;
        }

        .cancel-btn {
            width: 100%;
            margin-top: 8px;
            background: #eee4df;
            color: #68423c;
            display: none;
        }

        /* PRODUCTS */

        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .products-count {
            background: #f1e4da;
            color: #68423c;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .product-list {
            display: grid;
            gap: 15px;
        }

        .product-item {
            border: 1px solid #eaded7;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .product-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 12px;
            background: #f5eee9;
        }

        .product-info {
            flex: 1;
        }

        .product-info h3 {
            margin-bottom: 5px;
            color: #68423c;
        }

        .category {
            display: inline-block;
            font-size: 12px;
            background: #f1e4da;
            color: #68423c;
            padding: 4px 8px;
            border-radius: 20px;
            margin-bottom: 7px;
        }

        .price {
            font-weight: bold;
            color: #b8955c;
            margin-top: 5px;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .edit-btn {
            background: #eee4df;
            color: #68423c;
        }

        .delete-btn {
            background: #fbe4e4;
            color: #a11;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #756b67;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #756b67;
        }

        .message {
            margin-top: 12px;
            font-size: 14px;
            text-align: center;
        }

        .success {
            color: #18794e;
        }

        @media (max-width: 850px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .product-item {
                flex-direction: column;
                align-items: stretch;
            }

            .product-image {
                width: 100%;
                height: 180px;
            }

            .actions button {
                flex: 1;
            }

            .brand h2 {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- LOGIN PAGE -->

    <section id="loginPage">

        <div class="login-box">

            <img
                src="images/logo.png"
                class="login-logo"
                alt="Tasbehaaa Logo"
            >

            <h1>لوحة التحكم</h1>

            <p>Tasbehaaa For Hand Made Mirrors</p>

            <form id="loginForm">

                <div class="input-group">
                    <label>البريد الإلكتروني</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>كلمة المرور</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    تسجيل الدخول
                </button>

                <div id="loginError" class="error"></div>

            </form>

        </div>

    </section>


    <!-- DASHBOARD -->

    <section id="dashboard">

        <header>

            <div class="container header-content">

                <div class="brand">

                    <img
                        src="images/logo.png"
                        alt="Logo"
                    >

                    <h2>
                        Tasbehaaa Admin
                    </h2>

                </div>

                <button
                    class="logout-btn"
                    id="logoutBtn"
                >
                    تسجيل الخروج
                </button>

            </div>

        </header>


        <main>

            <div class="container">

                <div class="welcome">

                    <h1>
                        لوحة إدارة المنتجات
                    </h1>

                    <p>
                        من هنا تقدر تضيف وتعدل وتحذف المنتجات الموجودة على الموقع.
                    </p>

                </div>


                <div class="grid">


                    <!-- ADD / EDIT -->

                    <div class="card">

                        <h2 id="formTitle">
                            إضافة منتج جديد
                        </h2>

                        <form id="productForm">

                            <div class="input-group">

                                <label>
                                    اسم المنتج
                                </label>

                                <input
                                    type="text"
                                    id="productName"
                                    placeholder="مثال: مرآة كتب كتاب"
                                    required
                                >

                            </div>


                            <div class="input-group">

                                <label>
                                    القسم
                                </label>

                                <select
                                    id="productCategory"
                                    required
                                >

                                    <option value="">
                                        اختر القسم
                                    </option>

                                    <option value="مرايات">
                                        مرايات
                                    </option>

                                    <option value="صواني الشبكة">
                                        صواني الشبكة
                                    </option>

                                    <option value="البصمات">
                                        البصمات
                                    </option>

                                    <option value="بوكيهات الورد">
                                        بوكيهات الورد
                                    </option>

                                    <option value="مرايات الديكور">
                                        مرايات الديكور
                                    </option>

                                    <option value="مرايات بنترست">
                                        مرايات بنترست
                                    </option>

                                    <option value="بصمات كتب الكتاب">
                                        بصمات كتب الكتاب
                                    </option>

                                    <option value="Special Gift">
                                        Special Gift
                                    </option>

                                </select>

                            </div>


                            <div class="form-row">

                                <div class="input-group">

                                    <label>
                                        السعر
                                    </label>

                                    <input
                                        type="number"
                                        id="productPrice"
                                        placeholder="950"
                                        min="0"
                                        step="0.01"
                                        required
                                    >

                                </div>


                                <div class="input-group">

                                    <label>
                                        رابط الصورة
                                    </label>

                                    <input
                                        type="text"
                                        id="productImage"
                                        placeholder="images/products/product.jpg"
                                    >

                                </div>

                            </div>


                            <div class="input-group">

                                <label>
                                    وصف المنتج
                                </label>

                                <textarea
                                    id="productDescription"
                                    placeholder="اكتب وصف المنتج..."
                                ></textarea>

                            </div>


                            <button
                                type="submit"
                                class="save-btn"
                                id="saveBtn"
                            >
                                إضافة المنتج
                            </button>

                            <button
                                type="button"
                                class="cancel-btn"
                                id="cancelBtn"
                            >
                                إلغاء التعديل
                            </button>

                            <div
                                id="productMessage"
                                class="message"
                            ></div>

                        </form>

                    </div>


                    <!-- PRODUCTS -->

                    <div class="card">

                        <div class="products-header">

                            <h2>
                                المنتجات
                            </h2>

                            <span
                                class="products-count"
                                id="productsCount"
                            >
                                0 منتج
                            </span>

                        </div>

                        <div
                            id="productsList"
                            class="product-list"
                        >

                            <div class="loading">
                                جاري تحميل المنتجات...
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </main>

    </section>


<script>

    /* ==============================
       SUPABASE
    ============================== */

    const SUPABASE_URL =
        "https://nzkgjobzxgvroyzmvvdi.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_8aHDt5z7hV4Ojx69yJx8Fw_HWuFAJYJ";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* ==============================
       ELEMENTS
    ============================== */

    const loginPage =
        document.getElementById("loginPage");

    const dashboard =
        document.getElementById("dashboard");

    const loginForm =
        document.getElementById("loginForm");

    const loginError =
        document.getElementById("loginError");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const productForm =
        document.getElementById("productForm");

    const productsList =
        document.getElementById("productsList");

    const productsCount =
        document.getElementById("productsCount");

    const productMessage =
        document.getElementById("productMessage");

    const cancelBtn =
        document.getElementById("cancelBtn");

    const formTitle =
        document.getElementById("formTitle");

    const saveBtn =
        document.getElementById("saveBtn");


    let editingProductId = null;


    /* ==============================
       CHECK ADMIN
    ============================== */

    async function checkAdmin(user) {

        if (!user) {
            return false;
        }

        const { data, error } =
            await supabaseClient
                .from("admins")
                .select("user_id")
                .eq("user_id", user.id)
                .maybeSingle();

        if (error) {
            console.error(error);
            return false;
        }

        return !!data;
    }


    /* ==============================
       SHOW DASHBOARD
    ============================== */

    async function showDashboard(user) {

        const isAdmin =
            await checkAdmin(user);

        if (!isAdmin) {

            await supabaseClient.auth.signOut();

            loginError.textContent =
                "هذا الحساب ليس لديه صلاحية الدخول إلى لوحة التحكم.";

            return;
        }

        loginPage.style.display = "none";
        dashboard.style.display = "block";

        await loadProducts();
    }


    /* ==============================
       CHECK SESSION
    ============================== */

    async function checkSession() {

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();

        if (session && session.user) {

            await showDashboard(session.user);

        } else {

            loginPage.style.display = "flex";
            dashboard.style.display = "none";

        }
    }


    /* ==============================
       LOGIN
    ============================== */

    loginForm.addEventListener(
        "submit",
        async function (e) {

            e.preventDefault();

            loginError.textContent = "";

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                loginError.textContent =
                    "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

                console.error(error);

                return;
            }


            await showDashboard(data.user);

        }
    );


    /* ==============================
       LOGOUT
    ============================== */

    logoutBtn.addEventListener(
        "click",
        async function () {

            await supabaseClient.auth.signOut();

            dashboard.style.display = "none";
            loginPage.style.display = "flex";

            loginForm.reset();

        }
    );


    /* ==============================
       LOAD PRODUCTS
    ============================== */

    async function loadProducts() {

        productsList.innerHTML =
            `<div class="loading">جاري تحميل المنتجات...</div>`;


        const {
            data,
            error
        } = await supabaseClient
            .from("products")
            .select("*")
            .order("created_at", {
                ascending: false
            });


        if (error) {

            console.error(error);

            productsList.innerHTML =
                `<div class="empty">
                    حصل خطأ أثناء تحميل المنتجات.
                </div>`;

            return;
        }


        productsCount.textContent =
            `${data.length} منتج`;


        if (data.length === 0) {

            productsList.innerHTML =
                `<div class="empty">
                    لا توجد منتجات حتى الآن.<br>
                    أضف أول منتج من النموذج.
                </div>`;

            return;
        }


        productsList.innerHTML =
            data.map(product => {

                const image =
                    product.image_url ||
                    "images/logo.png";


                return `

                    <div class="product-item">

                        <img
                            class="product-image"
                            src="${escapeHtml(image)}"
                            alt="${escapeHtml(product.name)}"
                            onerror="this.src='images/logo.png'"
                        >

                        <div class="product-info">

                            <span class="category">
                                ${escapeHtml(product.category)}
                            </span>

                            <h3>
                                ${escapeHtml(product.name)}
                            </h3>

                            <div>
                                ${escapeHtml(product.description || "")}
                            </div>

                            <div class="price">
                                ${Number(product.price || 0).toLocaleString("en-US")}
                                جنيه
                            </div>

                        </div>

                        <div class="actions">

                            <button
                                class="edit-btn"
                                onclick="editProduct(${product.id})"
                            >
                                تعديل
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteProduct(${product.id})"
                            >
                                حذف
                            </button>

                        </div>

                    </div>

                `;

            }).join("");

    }


    /* ==============================
       ADD / UPDATE PRODUCT
    ============================== */

    productForm.addEventListener(
        "submit",
        async function (e) {

            e.preventDefault();


            productMessage.textContent = "";
            productMessage.className = "message";


            const product = {

                name:
                    document.getElementById("productName")
                        .value.trim(),

                category:
                    document.getElementById("productCategory")
                        .value,

                price:
                    Number(
                        document.getElementById("productPrice")
                            .value
                    ),

                image_url:
                    document.getElementById("productImage")
                        .value.trim(),

                description:
                    document.getElementById("productDescription")
                        .value.trim()

            };


            let error;


            if (editingProductId) {

                const result =
                    await supabaseClient
                        .from("products")
                        .update(product)
                        .eq("id", editingProductId);

                error = result.error;

            } else {

                const result =
                    await supabaseClient
                        .from("products")
                        .insert([product]);

                error = result.error;

            }


            if (error) {

                console.error(error);

                productMessage.textContent =
                    "حصل خطأ أثناء حفظ المنتج.";

                productMessage.className =
                    "message error";

                return;
            }


            productMessage.textContent =
                editingProductId
                    ? "تم تعديل المنتج بنجاح."
                    : "تم إضافة المنتج بنجاح.";

            productMessage.className =
                "message success";


            resetProductForm();

            await loadProducts();

        }
    );


    /* ==============================
       EDIT PRODUCT
    ============================== */

    window.editProduct =
        async function (id) {

            const {
                data,
                error
            } = await supabaseClient
                .from("products")
                .select("*")
                .eq("id", id)
                .single();


            if (error) {

                alert("تعذر تحميل المنتج.");

                return;
            }


            editingProductId = id;


            document.getElementById("productName").value =
                data.name || "";

            document.getElementById("productCategory").value =
                data.category || "";

            document.getElementById("productPrice").value =
                data.price || "";

            document.getElementById("productImage").value =
                data.image_url || "";

            document.getElementById("productDescription").value =
                data.description || "";


            formTitle.textContent =
                "تعديل المنتج";

            saveBtn.textContent =
                "حفظ التعديلات";

            cancelBtn.style.display =
                "block";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        };


    /* ==============================
       DELETE PRODUCT
    ============================== */

    window.deleteProduct =
        async function (id) {

            const confirmed =
                confirm(
                    "هل أنت متأكد من حذف هذا المنتج؟"
                );


            if (!confirmed) {
                return;
            }


            const {
                error
            } = await supabaseClient
                .from("products")
                .delete()
                .eq("id", id);


            if (error) {

                console.error(error);

                alert(
                    "حصل خطأ أثناء حذف المنتج."
                );

                return;
            }


            await loadProducts();

        };


    /* ==============================
       CANCEL EDIT
    ============================== */

    cancelBtn.addEventListener(
        "click",
        function () {

            resetProductForm();

        }
    );


    /* ==============================
       RESET FORM
    ============================== */

    function resetProductForm() {

        editingProductId = null;

        productForm.reset();

        formTitle.textContent =
            "إضافة منتج جديد";

        saveBtn.textContent =
            "إضافة المنتج";

        cancelBtn.style.display =
            "none";

    }


    /* ==============================
       HTML ESCAPE
    ============================== */

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* ==============================
       AUTH STATE
    ============================== */

    supabaseClient.auth.onAuthStateChange(
        async function (event, session) {

            if (
                session &&
                session.user &&
                event === "SIGNED_IN"
            ) {

                await showDashboard(
                    session.user
                );

            }

        }
    );


    /* ==============================
       START
    ============================== */

    checkSession();

</script>

</body>
    </html>
